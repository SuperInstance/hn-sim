[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hn-sim"
version = "0.1.0"
description = "Goodhart-resistant HN reception forecast compass. Distribution, not scalar. Persona rotation + held-out resistance. Never a gate."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
hn-sim = "hn_sim.cli:main"

[tool.setuptools]
packages = ["hn_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
